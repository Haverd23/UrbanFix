services:
  api:
    image: haverd23/urbanfix:1.0
    depends_on:
      migration:
        condition: service_completed_successfully
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${DEFAULT_CONNECTION}   
      - ConnectionStrings__Redis=${REDIS_CONNECTION} 
    ports:
      - "8080:8080"
    networks:
      - urbanfix-network

  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd",
         "-S", "localhost",
         "-U", "sa",
         "-P", "${DB_SA_PASSWORD}",
         "-C", "-Q", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=${DB_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    networks:
      urbanfix-network:
        aliases:
          - sqlserver
  migration:
    image: haverd23/urbanfix-migrations:1.0
    depends_on:
      database:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=${DEFAULT_CONNECTION}
    networks:
      - urbanfix-network        
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    networks:
      - urbanfix-network
networks:
    urbanfix-network:
      driver: bridge

volumes:
  mssql_data:
  redis_data:
    
    
      